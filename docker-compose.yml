services:
  db:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: review_tag
      POSTGRES_USER: review_tag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.release}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review_tag -d review_tag"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build: .
    env_file: .env.release
    environment:
      DATABASE_URL: postgresql+psycopg://review_tag:${POSTGRES_PASSWORD}@db:5432/review_tag
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    env_file: .env.release
    environment:
      DATABASE_URL: postgresql+psycopg://review_tag:${POSTGRES_PASSWORD}@db:5432/review_tag
      RUN_EMBEDDED_WORKER: "0"
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  worker:
    build: .
    env_file: .env.release
    environment:
      DATABASE_URL: postgresql+psycopg://review_tag:${POSTGRES_PASSWORD}@db:5432/review_tag
    command: ["python", "-m", "backend.app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  postgres_data:
