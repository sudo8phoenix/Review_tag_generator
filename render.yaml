services:
  - type: web
    name: review-tag-generator-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: review-tag-generator-db
          property: connectionString
      - key: MODEL_BACKEND
        value: transformer
      - key: RUN_EMBEDDED_WORKER
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: LLM_PROVIDER
        value: disabled
      - key: LLM_AUTO_ANNOTATE
        value: "0"
databases:
  - name: review-tag-generator-db
    plan: free
    region: singapore
    databaseName: review_tag
    user: review_tag
