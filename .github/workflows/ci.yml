name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-bookworm
        env:
          POSTGRES_DB: review_tag_test
          POSTGRES_USER: review_tag
          POSTGRES_PASSWORD: review_tag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U review_tag -d review_tag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -e '.[backend,test]'
      - name: Run non-model tests including PostgreSQL integration
        env:
          APP_PROFILE: unit
          MODEL_BACKEND: fake
          POSTGRES_TEST_URL: postgresql+psycopg://review_tag:review_tag@127.0.0.1:5432/review_tag_test
        run: python -m pytest -m 'not model'

  frontend:
    runs-on: ubuntu-latest
    env:
      DEMO_MODEL_BACKEND: heuristic
      DEMO_DATABASE: /tmp/review-tag-generator-e2e.sqlite3
      API_PROXY_TARGET: http://127.0.0.1:8000
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: npm ci
      - name: Install backend dependencies
        working-directory: .
        run: python -m pip install -e '.[backend]'
      - name: Start heuristic API
        working-directory: .
        run: |
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > /tmp/review-tag-generator-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/review-tag-generator-api.log
          exit 1
      - run: npm run lint
      - run: npm run build
      - run: npm run build:extension
      - run: npm test -- --run
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
