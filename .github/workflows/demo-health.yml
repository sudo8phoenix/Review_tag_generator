name: Demo health check
on:
  workflow_dispatch:
  schedule:
    - cron: '7-57/10 * * * *'
permissions:
  contents: read
concurrency:
  group: demo-health
  cancel-in-progress: true
jobs:
  health:
    if: github.repository == 'sudo8phoenix/Review_tag_generator'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check the free demo API
        run: >-
          curl --fail --silent --show-error
          --max-time 90 --retry 2 --retry-delay 10 --retry-max-time 180
          https://review-tag-generator-api.onrender.com/api/health
